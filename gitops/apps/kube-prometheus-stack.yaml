apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 70.4.2
    helm:
      values: |
        grafana:
          adminPassword: admin  # might change this or use a secret in production
          ingress:
            enabled: false      # we'll expose via the existing ingress later
          persistence:
            enabled: true
            size: 5Gi

        prometheus:
          prometheusSpec:
            # How long to retain metrics data on disk
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            # Tell Prometheus to pick up ANY ServiceMonitor in ANY namespace.
            # Without this, it only scrapes ServiceMonitors in its own namespace.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false

        # We don't need the built-in alertmanager for now
        alertmanager:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true