apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paas-api-servicemonitor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yousefkh2/level_3
    targetRevision: main
    path: week_6/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
