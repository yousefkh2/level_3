# IAM Layer: ServiceAccount + RBAC for managing CNPG clusters

apiVersion: v1
kind: ServiceAccount
metadata:
  name: paas-api-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-manager-role
rules:
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paas-api-rolebinding
subjects:
- kind: ServiceAccount
  name: paas-api-sa
roleRef:
  kind: ClusterRole
  name: cluster-manager-role
  apiGroup: rbac.authorization.k8s.io
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paas-api
  template:
    metadata:
      labels:
        app: paas-api
    spec:
      serviceAccountName: paas-api-sa
      imagePullSecrets:
      - name: stackit-registry-key
      containers:
      - name: api
        image: registry.onstackit.cloud/level-3-paas/paas-api
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: API_USERNAME
          value: "admin"
        - name: API_PASSWORD
          value: "secret123"
        - name: JWT_SECRET
          value: "my-secret-key"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: paas-api-service
spec:
  selector:
    app: paas-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
      name: http
  type: ClusterIP